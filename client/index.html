<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- `viewport-fit=cover`: without it `env(safe-area-inset-*)` resolves to
         0 on every notched phone, and the player's tab row sits in the home
         indicator's gesture area (UX-PLAN 2.5). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The phone shell's canvas (tokens.css `--canvas`, Stage Dark), so the
         browser chrome around a player's screen is the same colour as the
         screen. -->
    <meta name="theme-color" content="#090b10" />
    <title>Floodlight</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
